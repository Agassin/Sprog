<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<meta name="description" content="Programme de musculation, séances, repos et progression. Installable et utilisable hors ligne.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Sprog — programme et suivi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#app">Aller au contenu</a>
<div class="messages">
<p id="network" class="banner" hidden>Hors ligne — les données restent sur cet appareil.</p>
<p id="storage-warning" class="banner warning" role="alert" hidden></p>
<div id="update-banner" class="banner" hidden>Une mise à jour est disponible. <button data-a="update">Mettre à jour</button></div>
<p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
</div>
<main id="app" tabindex="-1"></main>
<noscript><p>Active JavaScript pour utiliser Sprog. Les données de tes séances restent sur ton appareil.</p></noscript>
<nav aria-label="Navigation principale">
  <button data-t="home">Programme</button>
  <button data-t="seance">Séance</button>
  <button data-t="prog">Progression</button>
  <button data-t="suivi">Suivi</button>
  <button data-t="complement" aria-label="Travail complémentaire">Travail<br>complémentaire</button>
  <button data-t="settings">Réglages</button>
</nav>
<script src="program.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
